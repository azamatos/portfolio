name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm build

      # Fails the run if accessibility, best practices or SEO drop below 100 on any page (see lighthouserc.cjs).
      - name: Lighthouse
        run: pnpm dlx @lhci/cli@0.15.1 autorun
